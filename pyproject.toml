[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddns-update-monkey"
version = "0.1.0"
description = "Lightweight DDNS updater that keeps your DuckDNS hostname pointed at your current home IP address."
requires-python = ">=3.13"
dependencies = [
    "requests~=2.33",
    "python-dotenv~=1.2,>=1.2.2",  # CVE-2026-28684 (GHSA-mf9w-mj56-hr94)
    # Transitive via requests; floor set directly because requests' own
    # range (urllib3>=1.26) still admits versions where its normal body read
    # hits GHSA-vxq7-64xx-v4gw / GHSA-gh4c-6fx4-qh6g (fixed in 2.8.0).
    "urllib3>=2.8.0,<3",
    # Transitive via requests. requests verifies TLS against certifi's bundle;
    # before 2026.10.18 it trusts emSign roots with compromised intermediates
    # (GHSA-6q48-6c7w-9gw2) — an on-path attacker could intercept the token.
    # 2026.10.19 is the advisory's recommended release (unaffected roots kept).
    "certifi>=2026.10.19",
    # Transitive via requests. GHSA-65pc-fj4g-8rjx (CVE-2026-45409) is a DoS in
    # idna.encode() on crafted non-ASCII hostnames; ours come from config.toml,
    # so this is defense in depth.
    "idna>=3.15,<4",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pre-commit~=4.5",
    "ruff>=0.15.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monkey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/monkey --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"

[tool.coverage.run]
relative_files = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
